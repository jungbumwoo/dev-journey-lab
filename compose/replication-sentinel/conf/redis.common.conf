bind 0.0.0.0
protected-mode no
port 6379
dir /data

# AOF everysec is the MVP durability profile. It still permits roughly one
# second of data loss on a host crash and does not replace external backups.
appendonly yes
appendfsync everysec
save 60 1000

replica-read-only yes
repl-backlog-size 16mb
repl-backlog-ttl 3600

# Best-effort safety: writes stop if no sufficiently fresh replica remains.
# This bounds one failure mode but does not make replication synchronous.
min-replicas-to-write 1
min-replicas-max-lag 5

latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
